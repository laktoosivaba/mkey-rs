[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Andrey Shinkarev <rooh1622@gmail.com>", "Various LLMs"]
license = "MPL-2.0"

[workspace.dependencies]
mkey-core = { path = "crates/mkey-core" }
mkey-ble = { path = "crates/mkey-ble" }
mkey-sdk-virgil = { path = "crates/mkey-sdk-virgil" }

aes = "0.8"
base62 = "2"
base64 = "0.22"
btleplug = "0.11"
cbc = "0.1"
futures = "0.3.31"
getrandom = "0.3"
hex = "0.4"
iso7816-tlv = "0.4"
num-bigint = "0.4.6"
once_cell = "1"
pkcs8 = "0.10"
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = "1.20.0"
wasmtime = "29"

# ---------------------------------------------------------------------------
# The facade. Everything below is re-export; the code lives in `crates/`.
# ---------------------------------------------------------------------------

[package]
name = "mkey"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["ble"]
# The native Bluetooth shell: btleplug, tokio and the session driver.
ble = ["dep:mkey-ble"]
sdk = []
sdk-virgil = ["sdk", "dep:mkey-sdk-virgil"]

[dependencies]
mkey-core.workspace = true
mkey-ble = { workspace = true, optional = true }
mkey-sdk-virgil = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
dotenvy = "0.15"
hex.workspace = true
tokio.workspace = true

[[example]]
name = "mkey_open"
required-features = ["sdk", "ble"]

[[example]]
name = "mkey_decode"
required-features = ["sdk-virgil"]

[[example]]
name = "keystore_gen"
required-features = ["sdk-virgil"]

[[example]]
name = "keystore_check"
required-features = ["sdk-virgil"]
