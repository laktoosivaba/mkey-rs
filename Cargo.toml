[package]
name = "mkey"
version = "0.1.0"
edition = "2021"
authors = ["Andrey Shinkarev <rooh1622@gmail.com>", "Various LLMs"]
license = "MPL-2.0"

[features]
default = ["ble"]
# The native Bluetooth shell. Without it the crate is protocol only: crypto,
# key codec, SSP, Justin and the lock simulator, with no Bluetooth stack and no
# async runtime.
ble = ["dep:btleplug", "dep:tokio", "dep:futures", "dep:uuid"]
sdk = []
sdk-virgil = ["sdk", "dep:wasmtime", "dep:rsa", "dep:pkcs8", "dep:base64", "dep:rand"]

[dependencies]
btleplug = { version = "0.11", optional = true }
aes = "0.8"
cbc = "0.1"
iso7816-tlv = "0.4"
tokio = { version = "1", features = ["full"], optional = true }
thiserror = "1"
hex = "0.4"
getrandom = "0.3"
base62 = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
num-bigint = "0.4.6"
uuid = { version = "1.20.0", optional = true }
futures = { version = "0.3.31", optional = true }
wasmtime = { version = "29", optional = true }
rsa = { version = "0.9", optional = true }
pkcs8 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }

[[example]]
name = "mkey_open"
required-features = ["sdk", "ble"]

[[example]]
name = "mkey_decode"
required-features = ["sdk-virgil"]

[[example]]
name = "keystore_gen"
required-features = ["sdk-virgil"]

[[example]]
name = "keystore_check"
required-features = ["sdk-virgil"]

[dev-dependencies]
# `test-util` gives the detection tests a paused clock, so the protocol-info
# read timeout fires instantly instead of taking a real second.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
dotenvy = "0.15"
base64 = "0.22"
p12 = "0.6"
