[package]
name = "mkey"
version = "0.1.0"
edition = "2021"
authors = ["Andrey Shinkarev <rooh1622@gmail.com>", "Various LLMs"]
license = "MPL-2.0"

[features]
default = []
sdk = []
sdk-virgil = ["sdk", "dep:wasmtime", "dep:rsa", "dep:pkcs8", "dep:base64"]

[dependencies]
btleplug = "0.11"
aes = "0.8"
cbc = "0.1"
iso7816-tlv = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
hex = "0.4"
base62 = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
num-bigint = "0.4.6"
uuid = "1.20.0"
futures = "0.3.31"
wasmtime = { version = "29", optional = true }
rsa = { version = "0.9", optional = true }
pkcs8 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[[example]]
name = "mkey_open"
required-features = ["sdk"]

[[example]]
name = "mkey_decode"
required-features = ["sdk-virgil"]

[dev-dependencies]
dotenvy = "0.15"
base64 = "0.22"
p12 = "0.6"
