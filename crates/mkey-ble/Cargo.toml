[package]
name = "mkey-ble"
description = "Native BLE shell for the SALTO KS protocol: the transport trait, its btleplug implementation and the session driver."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["btleplug"]
# The radio. Without it the crate is the transport trait plus the session
# driver, which is what an in-process transport (the simulator) needs.
btleplug = ["dep:btleplug", "dep:futures"]

[dependencies]
mkey-core.workspace = true
tokio.workspace = true
uuid.workspace = true
btleplug = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
